name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /nabin-uranw
      # The three large video files are too big for this repository's API upload, so the Pages build streams them
      # from the main site. Remove this line once public/__f/*.mp4|webm are committed (for example with Git LFS).
      NEXT_PUBLIC_MEDIA_BASE: https://nabinbabuuranw.com.np
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/pages-fonts.mjs
      - run: npx next build
      - run: node scripts/pages-rewrite.mjs
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
